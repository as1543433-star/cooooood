<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توليد أكواد نسك</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7a4b">
<style>
  body{font-family:sans-serif;background:#f5f3ef;margin:0;padding:24px;text-align:center}
  h1{font-size:22px;margin:16px 0 24px}
  button{border:none;border-radius:26px;padding:16px 20px;font-size:18px;width:100%}
  .main{background:#0a7a4b;color:#fff}
  .card{background:#fff;border-radius:20px;padding:28px 14px;margin-top:22px;display:none}
  code{display:block;font-size:28px;direction:ltr;margin-bottom:18px;letter-spacing:1px}
  .copy{background:#111;color:#fff}
  .info{color:#666;margin-top:14px;font-size:15px}
</style>
</head>
<body>
<h1>توليد أكواد نسك</h1>
<button class="main" id="gen">توليد أكواد نسك</button>
<div class="card" id="card">
  <code id="code"></code>
  <button class="copy" id="copy">نسخ</button>
</div>
<div class="info" id="info"></div>

<script>
const KEY = 'used_codes';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let codes = [];
const $ = id => document.getElementById(id);

function used() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; }
}

function pending() {
  const u = used();
  return codes.filter(c => !u.includes(c));
}

function show() {
  const p = pending();
  if (!p.length) {
    $('card').style.display = 'none';
    $('info').textContent = 'مفيش أكواد جديدة دلوقتي. جرّب بعد شوية.';
    return;
  }
  $('code').textContent = p[0];
  $('card').style.display = 'block';
  $('info').textContent = 'متبقي ' + p.length + ' كود';
}

$('gen').onclick = async () => {
  $('info').textContent = 'جاري التوليد…';
  try {
    const r = await fetch('https://umrahcodes.click/');
    const text = await r.text();
    const found = text.match(/NG-[A-Za-z0-9]{8}/g) || [];
    codes = [...new Set(found)];
    show();
  } catch (e) {
    $('card').style.display = 'none';
    $('info').textContent = 'تعذّر التوليد. اتأكد من الإنترنت وجرّب تاني.';
  }
};

$('copy').onclick = async () => {
  const c = $('code').textContent;
  try { await navigator.clipboard.writeText(c); } catch (e) {}
  localStorage.setItem(KEY, JSON.stringify(used().concat(c)));
  show();
};
</script>
</body>
</html>
