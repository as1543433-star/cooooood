<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توليد أكواد نسك</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a7a4b">
<style>
  body{font-family:sans-serif;background:#f5f3ef;margin:0;padding:24px;text-align:center}
  h1{font-size:22px;margin:16px 0 24px}
  button{border:none;border-radius:26px;padding:16px 20px;font-size:18px;width:100%}
  .main{background:#0a7a4b;color:#fff}
  .card{background:#fff;border-radius:20px;padding:28px 14px;margin-top:22px;display:none}
  code{display:block;font-size:28px;direction:ltr;margin-bottom:18px;letter-spacing:1px}
  .copy{background:#111;color:#fff}
  .open{display:block;margin-top:12px;padding:16px 20px;border-radius:26px;background:#eee;color:#111;font-size:18px;text-decoration:none}
  .info{color:#666;margin-top:14px;font-size:15px}
</style>
</head>
<body>
<h1>توليد أكواد نسك</h1>
<button class="main" id="gen">توليد أكواد نسك</button>
<div class="card" id="card">
  <code id="code"></code>
  <button class="copy" id="copy">نسخ</button>
  <a class="open" id="open" href="#" target="_blank" rel="noopener">فتح في نسك</a>
</div>
<div class="info" id="info"></div>

<script>
const KEY = 'used_codes';
const CACHE = 'codes_all';
const TIME = 'codes_all_time';
const API = 'https://umrahcodes.click/open-data/v1/codes.json';
const REFRESH_MS = 60 * 60 * 1000;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let codes = [];
const $ = id => document.getElementById(id);

function used() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; }
}

async function load() {
  let list = null;
  try { list = JSON.parse(localStorage.getItem(CACHE)); } catch (e) {}
  const age = Date.now() - Number(localStorage.getItem(TIME) || 0);
  if (!list || !list.length || age > REFRESH_MS) {
    const r = await fetch(API);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    list = d.codes.map(x => x.code);
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    try {
      localStorage.setItem(CACHE, JSON.stringify(list));
      localStorage.setItem(TIME, String(Date.now()));
    } catch (e) {}
  }
  codes = list;
}

function show() {
  const u = new Set(used());
  const next = codes.find(c => !u.has(c));
  if (!next) {
    $('card').style.display = 'none';
    $('info').textContent = 'مفيش أكواد جديدة دلوقتي.';
    return;
  }
  $('info').textContent = '';
  $('code').textContent = next;
  $('open').href = 'https://services.nusuk.sa/app/?p=27&id=' + next;
  $('card').style.display = 'block';
}

$('gen').onclick = async () => {
  $('info').textContent = 'جاري التوليد…';
  try {
    await load();
    show();
  } catch (e) {
    $('card').style.display = 'none';
    $('info').textContent = 'تعذّر التوليد: ' + e.message;
  }
};

$('copy').onclick = async () => {
  const c = $('code').textContent;
  try { await navigator.clipboard.writeText(c); } catch (e) {}
  localStorage.setItem(KEY, JSON.stringify(used().concat(c)));
  show();
};

$('open').onclick = () => {
  const c = $('code').textContent;
  localStorage.setItem(KEY, JSON.stringify(used().concat(c)));
  setTimeout(show, 400);
};
</script>
</body>
</html>
